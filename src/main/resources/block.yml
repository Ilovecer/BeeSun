anchor:
  world: lobby
  x: -1.05
  y: 89.0
  z: 16.5
  block: RESPAWN_ANCHOR

hologram:
  enabled: true
  # Начальная высота первого ряда голограммы над блоком якоря
  base-height: 2.8

  # Строки голограммы.
  # content - текст строки с поддержкой цветов (&a, &l, &#RRGGBB) и плейсхолдеров
  # height - расстояние вниз до этой строки от предыдущей
  # offsetX - смещение по оси X относительно центра якоря
  # offsetZ - смещение по оси Z относительно центра якоря
  #
  # Доступные плейсхолдеры:
  # %time_prize% - оставшееся время в секундах до награды
  # %reward_mode% - название текущего режима награды (настраивается в messages.yml)
  lines:
    - content: "&6Ядро Солнца"
      height: 0.0
      offsetX: 0.0
      offsetZ: 0.0
    - content: "&fСейчас выдаёт: %reward_mode%"
      height: 0.4
      offsetX: 0.0
      offsetZ: 0.0
    - content: "&fЛут через &b%time_prize% сек."
      height: 0.28
      offsetX: 0.0
      offsetZ: 0.0
